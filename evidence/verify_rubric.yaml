rubrics:
  - id: 1
    type: p2p
    text: 没有队列配置变更时，Store 与 Eventbus consumer 的消息内容、事件等待、持久化记录和 MessageBus 禁用行为保持现有契约。
  - id: 2
    type: f2p
    text: 队列增删改或恢复只有在对应的完整消费者集合成功投入服务后才报告运行态生效，管理端能区分已持久化、已生效和可重试失败。
  - id: 3
    type: f2p
    text: SearchQueues 或任一消费者初始化失败时不会发布不完整队列集合，上一代仍可处理新流量，修复后重试能切换到已持久化配置。
  - id: 4
    type: f2p
    text: 并发或连续队列变更按已提交版本单调发布，较早的慢重载不能覆盖较新配置，也不会产生多个活跃监听器竞争同一输入。
  - id: 5
    type: f2p
    text: 每条被 Push 接收的消息固定使用接收时可见的队列代际，配置切换和重试期间不会丢失、重复分发或改投给错误消费者。
  - id: 6
    type: f2p
    text: 旧代际在已接收消息处理完成后确定退役，停用或删除只拒绝生效后的新写入，服务关闭不会遗留监听器或未决重载。
  - id: 7
    type: p2p
    text: 队列权限、stale data 校验、actionlog、Store 消息处理标记和 Eventbus 事件触发在成功切换与无变更路径上均不回归。
